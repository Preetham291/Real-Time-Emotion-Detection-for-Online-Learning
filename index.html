<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Detection Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-gray-100 text-gray-800">
    <div class="container mx-auto p-4 md:p-8">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-700">Real-Time Learning Dashboard</h1>
            <p class="text-lg text-gray-500">Live emotion analysis of the learning session</p>
        </header>
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-1 bg-white p-6 rounded-lg shadow-lg">
                <h2 class="text-2xl font-semibold mb-4">Student Feed</h2>
                <div class="bg-gray-900 rounded-md overflow-hidden aspect-video mb-4">
                    <video id="video" width="100%" height="auto" autoplay muted class="transform scale-x-[-1]"></video>
                </div>
                <div id="status" class="text-center text-xl font-medium p-3 rounded-md bg-blue-100 text-blue-800">
                    Connecting...
                </div>
            </div>
            <div class="lg:col-span-2 bg-white p-6 rounded-lg shadow-lg">
                <div class="mb-8">
                    <h2 class="text-2xl font-semibold mb-4">Emotion Timeline</h2>
                    <canvas id="emotionTimelineChart"></canvas>
                </div>
                <div>
                    <h2 class="text-2xl font-semibold mb-4">Session Summary</h2>
                    <div id="summary-container" class="grid grid-cols-2 md:grid-cols-3 gap-4 text-center"></div>
                </div>
            </div>
        </div>
    </div>
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const socket = io();
        const video = document.getElementById('video');
        const statusEl = document.getElementById('status');
        const summaryContainer = document.getElementById('summary-container');
        let emotionTimelineChart;
        const ctx = document.getElementById('emotionTimelineChart').getContext('2d');
        const emotionColors = {
            'Focused': 'rgba(54,162,235,0.6)', 'Happy': 'rgba(75,192,192,0.6)', 'Confused': 'rgba(255,159,64,0.6)',
            'Frustrated': 'rgba(255,99,132,0.6)', 'Surprised': 'rgba(255,206,86,0.6)', 'Sad': 'rgba(153,102,255,0.6)',
            'Bored': 'rgba(100,100,100,0.6)'
        };
        const emotionToNumeric = {'Frustrated':0, 'Bored':1, 'Sad':2, 'Confused':3, 'Focused':4, 'Surprised':5, 'Happy':6 };
        const numericToEmotion = Object.fromEntries(Object.entries(emotionToNumeric).map(e=>[e[1],e[0]]));
        emotionTimelineChart = new Chart(ctx, {
            type: 'line',
            data: { labels: [], datasets:[{ label:'Emotion Level', data:[], borderColor:'rgba(54,162,235,1)', backgroundColor:'rgba(54,162,235,0.2)', fill:true, stepped:true }] },
            options: {
                responsive: true,
                scales: {y: {beginAtZero: true, max: 6, ticks: { callback: val => numericToEmotion[val] }}},
                plugins: { tooltip: { callbacks: { label: ctx => 'Emotion: ' + numericToEmotion[ctx.parsed.y] } } }
            }
        });
        socket.on('connect', () => {
            statusEl.textContent = 'Connected & Streaming';
            statusEl.classList.replace('bg-blue-100', 'bg-green-100');
            statusEl.classList.replace('text-blue-800', 'text-green-800');
        });
        socket.on('disconnect', () => {
            statusEl.textContent = 'Disconnected';
            statusEl.classList.replace('bg-green-100', 'bg-red-100');
            statusEl.classList.replace('text-green-800', 'text-red-800');
        });
        socket.on('update_data', (data) => { updateDashboard(data); });
        if (navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({video:true})
                .then(stream => {
                    video.srcObject = stream;
                    setInterval(() => { sendFrame(video); }, 1000);
                })
                .catch(() => {
                    statusEl.textContent = 'Webcam access denied.';
                    statusEl.classList.replace('bg-blue-100', 'bg-red-100');
                });
        }
        function sendFrame(videoElem) {
            const canvas = document.createElement('canvas');
            canvas.width = videoElem.videoWidth; canvas.height = videoElem.videoHeight;
            canvas.getContext('2d').drawImage(videoElem, 0, 0, canvas.width, canvas.height);
            const data = canvas.toDataURL('image/jpeg', 0.8);
            socket.emit('video_frame', data);
        }
        function updateDashboard(data){
            const labels = data.emotions.map(e=>e.time);
            const chartData = data.emotions.map(e=>emotionToNumeric[e.emotion]);
            emotionTimelineChart.data.labels = labels;
            emotionTimelineChart.data.datasets[0].data = chartData;
            emotionTimelineChart.update();
            summaryContainer.innerHTML = '';
            const total = Object.values(data.summary).reduce((a,b)=>a+b,0);
            if (total === 0) return;
            for (const [emotion,count] of Object.entries(data.summary)){
                const percentage = ((count/total)*100).toFixed(1);
                const card = `<div class="bg-gray-50 p-4 rounded-lg border">
                    <div class="text-3xl font-bold" style="color:${emotionColors[emotion]?.replace('0.6','1')}">${percentage}%</div>
                    <div class="text-sm text-gray-600">${emotion}</div>
                </div>`;
                summaryContainer.innerHTML += card;
            }
        }
    });
    </script>
</body>
</html>
